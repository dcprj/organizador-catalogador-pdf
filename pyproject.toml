[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-pdf"
version = "0.4.0"
description = "CLI multiplataforma que organiza e cataloga PDFs com ABNT NBR 6023, Ficha Catalográfica (CIP), classificador Jev, enriquecimento opcional em APIs públicas e Markdown companion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dario Pinheiro" }]
keywords = ["pdf", "markdown", "obsidian", "abnt", "catalogacao", "cip"]

dependencies = [
    "httpx>=0.25",
    "requests>=2.28",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.1.0,<1.0.0"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
organizador-pdf = "organizador_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
